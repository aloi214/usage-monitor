name: PR Windows checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Source-contract tests read LF-delimited snippets on every platform.
      - name: Keep source line endings consistent
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Verify packaged name and version
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rice-monitor-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
