name: Manual Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      # Source-contract tests read LF-delimited snippets on every platform.
      - name: Keep source line endings consistent
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pane-private-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
