name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test and build release
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      # Source-contract tests read LF-delimited snippets on every platform.
      - name: Keep source line endings consistent
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check tag and manifest versions
        run: node scripts/check-release-version.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Require a commit already merged into main
        id: source
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tags must point to commits on main." }
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve build commit." }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri build -- --bundles nsis -- --locked
      - name: Verify packaged name and version
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1
      - name: Normalize filename and hash the installer
        run: node scripts/release-assets.mjs src-tauri/target/release/bundle/nsis
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rice-monitor-release
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified installer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Retrieve only reviewed publisher code at the immutable trigger SHA.
      # Never execute scripts from the build artifact or install application dependencies.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/publish-release.mjs
            scripts/release-assets.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rice-monitor-release
          path: release
      - name: Verify assets and resume the release by ID
        run: node scripts/publish-release.mjs release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
