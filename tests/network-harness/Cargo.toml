[package]
name = "pane-network-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tiny_http = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = "0.4"
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
md-5 = "0.11.0"
getrandom = "0.2"

sha2 = "0.10" # non-persisted credential equality fingerprint for Qwen cooldown

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
